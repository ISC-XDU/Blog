name: auto_deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # 手动触发

jobs:
  deploy:
    # 跟主站同名的 job —— PR 上也跑（仅 build 不部署），main 上才完整 deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pymdown-extensions

      - name: Build site
        run: mkdocs build --clean

      # 只在 main 分支上做部署（PR 不会触发，避免生产 Secret 泄漏）
      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ISC_SERVER_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.ISC_SERVER_HOST_ADDRESS }}
          REMOTE_USER: ${{ secrets.ISC_SERVER_USER }}
          TARGET: ${{ secrets.WORK_TARGEAT_PATH_BLOG }}
          SOURCE: 'site/'
          ARGS: '-rltgoDzvO --delete'
